{@dev.usersrvc.domain.Car[] cars}
{@java.time.LocalDate startDate}
{@java.time.LocalDate endDate}

<div id="carlist">
<table>
    <thead>
    <tr>
        <th>Car ID</th>
        <th>Plate number</th>
        <th>Manufacturer</th>
        <th>Model</th>
        <th>Reservation</th>
    </tr>
    </thead>

    {#for car in cars}
      <tr>
        <td>{car.id}</td>
        <td>{car.licensePlate}</td>
        <td>{car.manufacturer}</td>
        <td>{car.model}</td>
        <td>
            <!-- Target defines which element's content to overwrite with the form response data
                 Post defines which endpoint is invoked when the form is submitted. -->
            <form hx-target="#reservations"
                  hx-post="/reserve">
                <input type="hidden" name="startDate" value="{startDate}">
                <input type="hidden" name="endDate" value="{endDate}">
                <input type="hidden" name="carId" value="{car.id}">
                <button type="submit">Reserve</button>
            </form>
        </td>
      </tr>
    {/for}
</table>
</div>
