quarkus.http.port=8081
quarkus.http.test-port=8181
rental.start.path=/start/{userId}/{reservationId}

quarkus.smallrye-graphql-client.inventory-gql.url=http://localhost:8083/graphql

quarkus.oidc.application-type=service
# no further OIDC config; auth is optional for this service

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=user
quarkus.datasource.password=pass
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/reservation

# drop and create the database on startup
#quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.schema-management.strategy=drop-and-create

